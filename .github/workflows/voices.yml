name: Generate voices

# Actions → Generate voices → Run workflow. Needs the ELEVENLABS_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: ElevenLabs voice ID (empty = default)
        required: false
      force:
        description: Regenerate every clip
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
      - name: Generate clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ inputs.voice_id }}
        run: node tools/make-voices.mjs ${{ inputs.force && '--force' || '' }}
      - name: Commit clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add voices
          git diff --cached --quiet || (git commit -m "Update voice clips" && git push)

  # Pushes made with the workflow token don't trigger other workflows, so deploy from here.
  deploy:
    needs: voices
    uses: ./.github/workflows/pages.yml
